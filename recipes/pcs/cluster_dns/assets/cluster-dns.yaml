AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Sidecar DNS for an AWS PCS cluster. Creates a per-cluster Route53 private hosted
  zone associated with the cluster VPC, a scoped IAM managed policy that lets nodes
  register their own records, and a reconcile Lambda that deletes records for nodes
  that no longer exist. Deploy this against an existing cluster, then attach the
  managed policy to your node role and add the node lifecycle action script to each
  compute node group. Check the Outputs tab for values you will need.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Cluster
        Parameters:
          - VpcId
          - ClusterId
      - Label:
          default: DNS
        Parameters:
          - DomainName
          - RecordTTL
      - Label:
          default: Cleanup
        Parameters:
          - ReconcileIntervalMinutes
          - ClusterTagKey

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC of the target PCS cluster. The private hosted zone is associated with this VPC.

  ClusterId:
    Type: String
    Description: PCS cluster ID (for example, pcs_0123456789). Used to scope reconcile to this cluster's nodes.
    AllowedPattern: '^pcs_[a-z0-9]+$'

  DomainName:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]*\.(internal|local)$'
    Description: >-
      DNS zone name for this cluster. Leave blank to use "<ClusterId>.pcs.local".
      WARNING: a private hosted zone takes precedence over public DNS for this name,
      and every name under it, for EVERY instance in the VPC - not just cluster nodes.
      Use a name nothing else in your organization resolves. Lowercase only, and must
      end in .internal or .local.

  RecordTTL:
    Type: Number
    Default: 60
    MinValue: 1
    Description: TTL (seconds) for node A records.

  ReconcileIntervalMinutes:
    Type: Number
    Default: 5
    MinValue: 3
    MaxValue: 1440
    Description: >-
      How often the reconcile Lambda removes records for terminated nodes. Minimum 3:
      EventBridge rejects "rate(1 minutes)" (it requires the singular unit at 1), and an
      interval shorter than the function timeout would overlap invocations.

  ClusterTagKey:
    Type: String
    Default: "aws:pcs:cluster-id"
    Description: EC2 tag key that PCS applies to managed instances, carrying the cluster ID. Rarely changed.

Conditions:
  UseDefaultDomain: !Equals [!Ref DomainName, ""]

Resources:

  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !If [UseDefaultDomain, !Sub "${ClusterId}.pcs.local", !Ref DomainName]
      HostedZoneConfig:
        Comment: !Sub "PCS sidecar DNS for cluster ${ClusterId}"
      VPCs:
        - VPCId: !Ref VpcId
          VPCRegion: !Ref AWS::Region

  # Attach this to your PCS node instance role so nodes can register their own record.
  NodeDnsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub "Lets PCS nodes register DNS records in the ${ClusterId} hosted zone"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # A node only ever UPSERTs one A record for itself. Three restrictions apply:
          # the action must be UPSERT, the type must be A, and the record NAME must be
          # exactly one label under the zone.
          #
          # The name restriction matters more than it looks. Without it a node can write
          # the zone apex (which blocks DeleteHostedZone, wedging stack deletion) or a
          # wildcard "*.<zone>" (which answers every name in the zone that has no exact
          # record, and which reconcile will not remove if it points at a live instance).
          #
          # Route53's IAM model still cannot bind a node to its OWN name from a role
          # shared by every node, so a node can overwrite a PEER's A record. Reconcile
          # does not repair that. See "Security considerations" in the README.
          - Sid: RegisterOwnRecord
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZone}"
            Condition:
              # ForAllValues is true when its key is ABSENT from the request, so every
              # restriction below would pass vacuously on a request shape that omitted
              # the key. Null "false" requires each key to be present first.
              "Null":
                "route53:ChangeResourceRecordSetsActions": "false"
                "route53:ChangeResourceRecordSetsRecordTypes": "false"
                "route53:ChangeResourceRecordSetsNormalizedRecordNames": "false"
              "ForAllValues:StringEquals":
                "route53:ChangeResourceRecordSetsActions": ["UPSERT"]
                "route53:ChangeResourceRecordSetsRecordTypes": ["A"]
              # "<label>.<zone>" only.
              "ForAllValues:StringLike":
                "route53:ChangeResourceRecordSetsNormalizedRecordNames":
                  - !Sub
                    - "*.${Zone}"
                    - Zone: !If [UseDefaultDomain, !Sub "${ClusterId}.pcs.local", !Ref DomainName]
              # Excludes the apex (no leading label), anything deeper than one label,
              # and wildcards - Route53 normalizes "*" to the octal escape \052.
              "ForAllValues:StringNotLike":
                "route53:ChangeResourceRecordSetsNormalizedRecordNames":
                  - '*\052*'
                  - !Sub
                    - "*.*.${Zone}"
                    - Zone: !If [UseDefaultDomain, !Sub "${ClusterId}.pcs.local", !Ref DomainName]

  ReconcileFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: reconcile
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZone}"
              # DescribeInstances does not support resource-level permissions.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-reconcile:*"

  ReconcileFunction:
    Type: AWS::Lambda::Function
    # The function must outlive its log group on the way out. Deletion runs in reverse
    # dependency order, so this makes CloudFormation remove the function first; otherwise
    # the delete-time purge invocation can write after the group is gone and Lambda
    # silently recreates it, orphaning a never-expire group after teardown.
    DependsOn: ReconcileLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-reconcile"
      Description: !Sub "Removes stale DNS records for terminated nodes in cluster ${ClusterId}"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt ReconcileFunctionRole.Arn
      Environment:
        Variables:
          HOSTED_ZONE_ID: !Ref HostedZone
          ZONE_NAME: !If [UseDefaultDomain, !Sub "${ClusterId}.pcs.local", !Ref DomainName]
          CLUSTER_ID: !Ref ClusterId
          TAG_KEY: !Ref ClusterTagKey
      Code:
        ZipFile: |
          import os
          import boto3
          import cfnresponse

          r53 = boto3.client("route53")
          ec2 = boto3.client("ec2")

          # A node can rewrite the VALUE of any A record in the zone, so record contents
          # are attacker-influenced data. Two rules follow, and the code below sticks to
          # them: never let record content decide how a request is SIZED, and never let a
          # single unprocessable record stop the whole pass.


          def apex_of(zone_name):
              """The zone's own name in the form ListResourceRecordSets returns.

              Lowercased, because DNS names are case-insensitive and a byte comparison
              against an operator-supplied parameter would miss on any uppercase letter.
              """
              return zone_name.rstrip(".").lower() + "."


          def live_ips():
              """Private IPs held by instances still alive in this cluster.

              Every address on every ENI is collected, not just Instances[].PrivateIpAddress,
              so a node that registered a secondary address is not mistaken for a dead one.
              """
              ips = set()
              paginator = ec2.get_paginator("describe_instances")
              pages = paginator.paginate(
                  Filters=[
                      {"Name": "tag:" + os.environ["TAG_KEY"], "Values": [os.environ["CLUSTER_ID"]]},
                      {"Name": "instance-state-name",
                       "Values": ["pending", "running", "shutting-down", "stopping", "stopped"]},
                  ]
              )
              for page in pages:
                  for res in page["Reservations"]:
                      for inst in res["Instances"]:
                          if inst.get("PrivateIpAddress"):
                              ips.add(inst["PrivateIpAddress"])
                          for nic in inst.get("NetworkInterfaces", []):
                              for addr in nic.get("PrivateIpAddresses", []):
                                  if addr.get("PrivateIpAddress"):
                                      ips.add(addr["PrivateIpAddress"])
              return ips


          def judgeable(rr, apex, purge):
              """Whether reconcile may form an opinion about this record."""
              name = rr["Name"].lower()
              if purge:
                  # Empty the zone so it can be deleted. Route53 requires the apex SOA and
                  # NS to remain; everything else must go, whatever its type. Filtering to
                  # type A here would leave a CNAME/TXT/PTR behind and DeleteHostedZone
                  # would then fail with the stack already mid-delete.
                  return not (name == apex and rr["Type"] in ("SOA", "NS"))
              if rr["Type"] != "A" or name == apex:
                  return False
              # Records this recipe creates are single-value address records. An ALIAS
              # record has no ResourceRecords at all, and a multi-value record was not
              # written by the node script, so neither is ours to delete. Without this the
              # empty-value case makes "no live IP" vacuously true and silently destroys
              # operator-created records on every run.
              return len(rr.get("ResourceRecords", [])) == 1


          def submit(zone, batch):
              """Submit one change batch, tolerating changes that cannot be applied.

              Route53 applies a batch atomically, so one record that was rewritten while
              we were listing - or that is otherwise unprocessable - fails all of its
              companions. On failure the batch is retried one change at a time, so the
              cost of a poisoned record is that record and nothing else. Without this, a
              node could stop every deletion in the zone indefinitely by keeping a single
              record in flux.
              """
              if not batch:
                  return 0
              try:
                  r53.change_resource_record_sets(
                      HostedZoneId=zone, ChangeBatch={"Changes": batch}
                  )
                  return len(batch)
              except Exception as exc:  # noqa: BLE001
                  if len(batch) == 1:
                      print("skipping unprocessable change:",
                            batch[0]["ResourceRecordSet"].get("Name"), exc)
                      return 0
                  print("change batch failed; retrying individually:", exc)
                  return sum(submit(zone, [change]) for change in batch)


          def reconcile(zone, zone_name, purge=False):
              """Delete records with no live owner. purge=True empties the zone."""
              apex = apex_of(zone_name)
              keep = set() if purge else live_ips()
              if not purge and not keep:
                  # An empty result is indistinguishable from "the tag filter matched
                  # nothing", so treat it as untrustworthy rather than as "every node is
                  # gone". Otherwise a single mistyped ClusterTagKey deletes the zone.
                  print("no live instances matched this cluster; skipping reconcile")
                  return 0

              candidates = []
              paginator = r53.get_paginator("list_resource_record_sets")
              for page in paginator.paginate(HostedZoneId=zone):
                  for rr in page["ResourceRecordSets"]:
                      if not judgeable(rr, apex, purge):
                          continue
                      if purge or rr["ResourceRecords"][0]["Value"] not in keep:
                          candidates.append(rr)

              # Re-read liveness and drop anything that came up while we were listing, so
              # an instance that registered mid-pass does not lose its fresh record. The
              # first snapshot is taken before the listing begins, so on its own it is
              # stale by the time a deletion is decided.
              if candidates and not purge:
                  keep |= live_ips()
                  candidates = [rr for rr in candidates
                                if rr["ResourceRecords"][0]["Value"] not in keep]

              # Batch by VALUE count as well as change count. Route53 bounds a request by
              # ResourceRecord elements and by total value bytes, not by number of changes,
              # so a count-only bound lets record content overflow the request.
              deleted, batch, elems = 0, [], 0
              for rr in candidates:
                  n = max(len(rr.get("ResourceRecords", [])), 1)
                  if batch and (len(batch) >= 100 or elems + n > 400):
                      deleted += submit(zone, batch)
                      batch, elems = [], 0
                  batch.append({"Action": "DELETE", "ResourceRecordSet": rr})
                  elems += n
              deleted += submit(zone, batch)
              return deleted


          def handler(event, context):
              # CloudFormation custom resource: empty the zone so it can be removed.
              if isinstance(event, dict) and "RequestType" in event:
                  # A stable physical ID. Without one cfnresponse defaults to the log
                  # stream name, which differs per invocation, so CloudFormation would
                  # treat the resource as replaced and send a Delete for the "old" one -
                  # purging a live cluster's zone during an ordinary stack update.
                  pid = "cluster-dns-zone-purge"
                  req = event["RequestType"]
                  new = event.get("ResourceProperties") or {}
                  old = event.get("OldResourceProperties") or {}
                  try:
                      deleted = 0
                      if req == "Delete":
                          deleted = reconcile(new["HostedZoneId"], new["ZoneName"], purge=True)
                      elif req == "Update" and old.get("HostedZoneId") not in (None, new.get("HostedZoneId")):
                          # DomainName changed, so the zone was replaced. Empty the OLD
                          # zone, which CloudFormation is about to delete and which no
                          # longer has a reconciler pointing at it.
                          deleted = reconcile(old["HostedZoneId"], old["ZoneName"], purge=True)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                       {"Deleted": deleted}, physicalResourceId=pid)
                  except Exception as exc:  # noqa: BLE001
                      print("purge failed:", exc)
                      cfnresponse.send(event, context, cfnresponse.FAILED,
                                       {"Error": str(exc)}, physicalResourceId=pid)
                  return

              # Scheduled reconcile.
              deleted = reconcile(os.environ["HOSTED_ZONE_ID"], os.environ["ZONE_NAME"])
              print("reconcile deleted", deleted, "stale record(s)")

  ReconcileSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: !Sub "Periodic DNS reconcile for cluster ${ClusterId}"
      ScheduleExpression: !Sub "rate(${ReconcileIntervalMinutes} minutes)"
      State: ENABLED
      Targets:
        - Id: reconcile
          Arn: !GetAtt ReconcileFunction.Arn

  ReconcileSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReconcileFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReconcileSchedule.Arn
      SourceAccount: !Ref AWS::AccountId

  # Owned by the stack so retention is bounded and the group is removed on delete.
  # Lambda would otherwise auto-create it with retention set to never expire, and
  # leave it behind after teardown.
  ReconcileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-reconcile"
      RetentionInDays: 14

  # Empties the zone on stack delete so the hosted zone can be removed. HostedZoneId
  # and ZoneName are declared as properties so that replacing the zone (which a
  # DomainName change does) sends an Update carrying the OLD zone, letting the handler
  # empty it instead of orphaning it inside the VPC with no reconciler.
  ZonePurge:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ReconcileFunction.Arn
      HostedZoneId: !Ref HostedZone
      ZoneName: !If [UseDefaultDomain, !Sub "${ClusterId}.pcs.local", !Ref DomainName]

Outputs:
  HostedZoneId:
    Description: Route53 private hosted zone ID.
    Value: !Ref HostedZone
  ZoneName:
    Description: DNS zone name. Nodes register <PCS_NODE_ID>.<ZoneName>.
    Value: !If [UseDefaultDomain, !Sub "${ClusterId}.pcs.local", !Ref DomainName]
  NodeDnsManagedPolicyArn:
    Description: Attach this managed policy to your PCS node instance role.
    Value: !Ref NodeDnsManagedPolicy
  RecordTTL:
    Description: TTL to pass to the node lifecycle action script.
    Value: !Ref RecordTTL
