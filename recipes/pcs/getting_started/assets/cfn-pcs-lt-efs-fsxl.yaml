AWSTemplateFormatVersion: 2010-09-09
Description: EC2 launch templates for AWS PCS login and compute node groups.
  This template creates EC2 launch templates for AWS PCS login and compute node groups.
  It attaches the security groups needed to reach the EFS and FSx for Lustre file systems, configures EC2 instance tags, enables Instance Metadata Service Version 2 (IMDSv2), and sets up the cluster security group for communication with the AWS PCS controller.
  Additionally, it shows how to configure inbound SSH access to the login nodes.
  Mounting the file systems and forwarding node logs are handled by node lifecycle actions on the compute node groups, not by launch template UserData.
  Use this template as a starting point to create custom launch templates tailored to your specific requirements.
  Check the Outputs tab of this stack for useful details about resources created by this template.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Security
        Parameters:
          - VpcDefaultSecurityGroupId
          - ClusterSecurityGroupId
          - SshSecurityGroupId
          - SshKeyName
      - Label:
          default: File systems
        Parameters:
          - EfsFilesystemSecurityGroupId
          - FSxLustreFilesystemSecurityGroupId

Parameters:

  VpcDefaultSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Cluster VPC 'default' security group. Make sure you choose the one from your cluster VPC!
  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for PCS cluster controller and nodes.
  SshSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for SSH into login nodes
  SshKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH key name for access to login nodes
  # The file systems are mounted by node lifecycle actions on the compute node groups,
  # so this template only needs the file system security groups, which it attaches to
  # the nodes to grant network access to EFS and FSx for Lustre.
  EfsFilesystemSecurityGroupId:
    Type: String
    Description: Security group for EFS filesystem. Choose VPC default if filesystem was created using EFS console quick-start defaults.
  FSxLustreFilesystemSecurityGroupId:
    Type: String
    Description: Security group for Amazon FSx for Lustre filesystem. Choose VPC default if filesystem was created using FSx console quick-start defaults.

Resources:

  LoginLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'login-${AWS::StackName}'
      LaunchTemplateData:
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: HPCRecipes
                Value: "true"
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 4
          HttpTokens: required
        KeyName: !Ref SshKeyName
        SecurityGroupIds:
          - !Ref VpcDefaultSecurityGroupId
          - !Ref ClusterSecurityGroupId
          - !Ref SshSecurityGroupId
          - !Ref EfsFilesystemSecurityGroupId
          - !Ref FSxLustreFilesystemSecurityGroupId
        # Filesystem mounting and log forwarding are handled by node lifecycle
        # actions on the compute node groups, not by launch template UserData.

  ComputeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'compute-${AWS::StackName}'
      LaunchTemplateData:
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: HPCRecipes
                Value: "true"
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 4
          HttpTokens: required
        SecurityGroupIds:
          - !Ref VpcDefaultSecurityGroupId
          - !Ref ClusterSecurityGroupId
          - !Ref EfsFilesystemSecurityGroupId
          - !Ref FSxLustreFilesystemSecurityGroupId
        KeyName: !Ref SshKeyName
        # Filesystem mounting and log forwarding are handled by node lifecycle
        # actions on the compute node groups, not by launch template UserData.

Outputs:
  LoginLaunchTemplateId:
    Description: "Login nodes template ID"
    Value: !Ref LoginLaunchTemplate
  LoginLaunchTemplateName:
    Description: "Login nodes template name"
    Value: !Sub 'login-${AWS::StackName}'
  ComputeLaunchTemplateId:
    Description: "Compute nodes template ID"
    Value: !Ref ComputeLaunchTemplate
  ComputeLaunchTemplateName:
    Description: "Compute nodes template name"
    Value: !Sub 'compute-${AWS::StackName}'
